zabbix_export:
  version: '6.4'
  template_groups:
    - uuid: 0b1cc2278990439b99b24b55e86cd6df
      name: Services/Fabric/Loadbalancer
  templates:
    - uuid: e5bfeb1eb37947d59b604fa2d443a22f
      template: 'Template Keepalived'
      name: 'Template Keepalived'
      groups:
        - name: Services/Fabric/Loadbalancer
      items:
        - uuid: 4fc6bf205776409aa97ddc272c1299f1
          name: 'Keepalived: número de processos ativos'
          key: 'proc.num[keepalived]'
          history: 90d
          tags:
            - tag: Application
              value: Keepalived
          triggers:
            - uuid: 1b6a23c73d4740cc87ab62275ccdeaac
              expression: 'last(/Template Keepalived/proc.num[keepalived])<2'
              name: 'Processos do Keepalived parados'
              priority: DISASTER
      discovery_rules:
        - uuid: 8b2972124ccd4d1f9683621e6518275c
          name: 'VRRP instances'
          key: keepalived.instance.discovery
          delay: 300s
          lifetime: 30d
          item_prototypes:
            - uuid: f6d28636224945fba07df3537120440c
              name: 'Keepalived: state da instância {#INSTANCE}'
              key: 'keepalived.instance.check[{#INSTANCE}]'
              value_type: TEXT
              trends: '0'
              trigger_prototypes:
                - uuid: faddbf76f6fe4367aeedea5bb9905400
                  expression: 'count(/Template Keepalived/keepalived.instance.check[{#INSTANCE}],#2,,"BACKUP")=1 and last(/Template Keepalived/keepalived.instance.check[{#INSTANCE}])="BACKUP"'
                  name: 'Alto_Impacto - {HOST.NAME}: Keepalived: instância {#INSTANCE} mudou para o state BACKUP'
                  priority: HIGH
                  tags:
                    - tag: Application
                      value: Keepalived
                - uuid: 05bc333d96f243aca6ffb3e9eedc8c2c
                  expression: 'count(/Template Keepalived/keepalived.instance.check[{#INSTANCE}],#2,,"DELETED")=1 and last(/Template Keepalived/keepalived.instance.check[{#INSTANCE}])="DELETED"'
                  name: 'Alto_Impacto - {HOST.NAME}: Keepalived: instância {#INSTANCE} mudou para o state DELETED'
                  priority: HIGH
                  tags:
                    - tag: Application
                      value: Keepalived
                - uuid: 9a306b6b2a8b43709f69f79ecbfd1335
                  expression: 'count(/Template Keepalived/keepalived.instance.check[{#INSTANCE}],#2,,"FAULT")=1 and last(/Template Keepalived/keepalived.instance.check[{#INSTANCE}])="FAULT"'
                  name: 'Alto_Impacto - {HOST.NAME}: Keepalived: instância {#INSTANCE} mudou para o state FAULT'
                  priority: HIGH
                  tags:
                    - tag: Application
                      value: Keepalived
                - uuid: 78a8f0e24ee34bf980632982859e8518
                  expression: 'count(/Template Keepalived/keepalived.instance.check[{#INSTANCE}],#2,,"STOP")=1 and last(/Template Keepalived/keepalived.instance.check[{#INSTANCE}])="STOP"'
                  name: 'Alto_Impacto - {HOST.NAME}: Keepalived: instância {#INSTANCE} mudou para o state STOP'
                  priority: HIGH
                  tags:
                    - tag: Application
                      value: Keepalived
                - uuid: 0badbf6f9aab4bfea7d5f571abfd1740
                  expression: 'count(/Template Keepalived/keepalived.instance.check[{#INSTANCE}],#2,,"MASTER")=1 and last(/Template Keepalived/keepalived.instance.check[{#INSTANCE}])="MASTER"'
                  name: 'Médio Impacto - {HOST.NAME}: Keepalived: instância {#INSTANCE} mudou para o state MASTER'
                  priority: HIGH
                  tags:
                    - tag: Application
                      value: Keepalived
